ont-size: 1.8rem; margin-bottom: 1rem; display: block; }\n.trat-name { font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; color: var(--text); margin-bottom: 0.7rem; line-height: 1.2; }\n.trat-desc { font-size: 0.8rem; color: var(--text-soft); line-height: 1.8; margin-bottom: 1.3rem; }\n.trat-tag { font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--sage-deep); border: 1px solid rgba(107,83,68,0.3); padding: 0.25rem 0.7rem; display: inline-block; }\n\n/* PROMOZIONI */\n.promozioni { padding: 8rem 6rem; background: var(--blush-light); }\n.promo-header { margin-bottom: 4rem; }\n.promo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }\n.promo-card { background: var(--white); padding: 2.5rem 2.2rem; position: relative; overflow: hidden; border-top: 3px solid var(--blush-deep); transition: transform 0.3s; }\n.promo-card:hover { transform: translateY(-4px); }\n.promo-badge { position: absolute; top: 1.5rem; right: 1.5rem; background: var(--sage-deep); color: var(--white); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; padding: 0.3rem 0.75rem; }\n.promo-eyebrow { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blush-deep); margin-bottom: 0.8rem; }\n.promo-title { font-family: var(--font-display); font-size: 1.5rem; font-style: italic; color: var(--text); margin-bottom: 0.8rem; line-height: 1.25; }\n.promo-desc { font-size: 0.8rem; color: var(--text-soft); line-height: 1.8; margin-bottom: 1.5rem; }\n.promo-validity { font-size: 0.7rem; color: var(--sage); border-top: 1px solid rgba(139,115,85,0.2); padding-top: 1rem; }\n.promo-cta-wrap { margin-top: 3.5rem; text-align: center; }\n.promo-note { font-size: 0.82rem; color: var(--text-soft); margin-top: 1rem; }\n\n/* TEAM */\n.team { padding: 8rem 6rem; background: var(--cream-warm); }\n.team-header { text-align: center; margin-bottom: 5rem; }\n.team-header .section-label { justify-content: center; }\n.team-header .section-label::before { display: none; }\n.team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; max-width: 900px; margin: 0 auto; }\n.team-card { background: var(--white); display: grid; grid-template-columns: 110px 1fr; gap: 2rem; padding: 2.8rem; border-bottom: 3px solid var(--sage-light); transition: border-color 0.3s, transform 0.3s; }\n.team-card:hover { border-color: var(--sage-deep); transform: translateY(-4px); }\n.team-avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--sage-pale); border: 2px solid var(--sage-light); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 2rem; font-style: italic; color: var(--sage-deep); align-self: start; }\n.team-name { font-family: var(--font-display); font-size: 1.8rem; font-weight: 300; color: var(--text); margin-bottom: 0.2rem; }\n.team-role { font-size: 0.67rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sage); margin-bottom: 1.1rem; }\n.team-bio { font-size: 0.82rem; color: var(--text-mid); line-height: 1.85; margin-bottom: 1.2rem; }\n.team-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }\n.team-tag { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; background: var(--sage-pale); color: var(--sage-deep); padding: 0.22rem 0.7rem; }\n\n/* CONTATTI */\n.contatti { padding: 8rem 6rem; background: var(--white); display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; align-items: start; }\n.contatti-detail { display: flex; gap: 1.4rem; padding: 1.8rem 0; border-bottom: 1px solid rgba(139,115,85,0.15); }\n.contatti-detail:first-of-type { padding-top: 2rem; }\n.contatti-detail:last-of-type { border-bottom: none; }\n.detail-icon { width: 40px; height: 40px; background: var(--sage-pale); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }\n.detail-label { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sage); margin-bottom: 0.3rem; }\n.detail-val { font-size: 0.88rem; color: var(--text); line-height: 1.65; }\n.orari-table { width: 100%; margin-top: 0.5rem; }\n.orari-table tr td { font-size: 0.82rem; padding: 0.4rem 0; border-bottom: 1px solid rgba(139,115,85,0.1); }\n.orari-table tr:last-child td { border-bottom: none; }\n.orari-table td:first-child { color: var(--text-soft); width: 58%; }\n.orari-table td:last-child { color: var(--text); font-weight: 400; }\n.orari-table .closed td { color: rgba(139,115,85,0.55); }\n.map-btn { display: flex; align-items: center; gap: 1rem; background: var(--sage-pale); border: 1px solid rgba(139,115,85,0.2); padding: 1.2rem 1.8rem; margin-top: 2rem; color: var(--sage-deep); text-decoration: none; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; transition: background 0.3s; }\n.map-btn:hover { background: var(--sage-light); }\n.form-title { font-family: var(--font-display); font-size: 2.2rem; font-weight: 300; color: var(--text); margin-bottom: 2rem; }\n.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }\n.form-group { margin-bottom: 1rem; }\n.form-group label { display: block; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sage); margin-bottom: 0.5rem; }\n.form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--cream-warm); border: 1px solid rgba(139,115,85,0.22); padding: 0.82rem 1.1rem; font-family: var(--font-body); font-size: 0.84rem; color: var(--text); outline: none; transition: border-color 0.3s; appearance: none; border-radius: 0; }\n.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--sage-deep); }\n.form-group textarea { min-height: 110px; resize: vertical; }\n.btn-submit { width: 100%; background: var(--sage-deep); color: var(--white); font-family: var(--font-body); font-size: 0.7rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; border: none; padding: 1.1rem 2rem; cursor: pointer; margin-top: 0.5rem; transition: background 0.3s, transform 0.2s; }\n.btn-submit:hover { background: var(--sage); transform: translateY(-2px); }\n.form-note { font-size: 0.7rem; color: var(--text-soft); text-align: center; margin-top: 0.8rem; }\n\n/* FOOTER */\nfooter { background: var(--text); padding: 5rem 6rem 3rem; }\n.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 3rem; margin-bottom: 4rem; }\n.footer-logo { font-family: var(--font-display); font-size: 2.4rem; font-weight: 300; font-style: italic; color: var(--white); margin-bottom: 1rem; }\n.footer-tagline { font-size: 0.8rem; color: rgba(254,252,250,0.38); line-height: 1.8; max-width: 250px; }\n.footer-social { display: flex; gap: 0.8rem; margin-top: 1.8rem; }\n.social-link { width: 36px; height: 36px; border: 1px solid rgba(201,181,160,0.2); display: flex; align-items: center; justify-content: center; color: rgba(254,252,250,0.38); text-decoration: none; font-size: 0.75rem; transition: all 0.3s; }\n.social-link:hover { border-color: var(--sage-light); color: var(--sage-light); }\n.footer-col-title { font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--sage-light); margin-bottom: 1.5rem; }\n.footer-links { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }\n.footer-links a { font-size: 0.8rem; color: rgba(254,252,250,0.4); text-decoration: none; transition: color 0.3s; }\n.footer-links a:hover { color: var(--sage-light); }\n.footer-bottom { border-top: 1px solid rgba(201,181,160,0.1); padding-top: 2rem; display: flex; justify-content: space-between; font-size: 0.7rem; color: rgba(254,252,250,0.22); }\n\n/* ANIMATIONS */\n@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }\n.au { opacity: 0; animation: fadeUp 0.8s ease forwards; }\n.d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; } .d3 { animation-delay: 0.4s; }\n\n/* MOBILE */\n@media (max-width: 900px) {\nnav { padding: 1.2rem 1.8rem; } .nav-links { display: none; }\n.hero { grid-template-columns: 1fr; } .hero-left { padding: 8rem 2.5rem 4rem; } .hero-left::after { display: none; } .hero-right { height: 55vw; }\n.gallery-grid { grid-template-columns: 1fr; }\n.preview-grid { grid-template-columns: 1fr; }\n.promo-preview-grid { grid-template-columns: 1fr; }\n.ecommerce-grid { grid-template-columns: 1fr; }\n.filosofia, .olistico, .contatti { grid-template-columns: 1fr; gap: 3rem; padding: 5rem 2.5rem; }\n.trattamenti, .promozioni, .team, .gallery-studio, .trattamenti-preview, .promozioni-preview, .ecommerce { padding: 5rem 2.5rem; }\n.trattamenti-grid, .promo-grid { grid-template-columns: 1fr; }\n.team-grid { grid-template-columns: 1fr; } .team-card { grid-template-columns: 1fr; }\n.footer-grid { grid-template-columns: 1fr 1fr; gap: 2rem; } footer { padding: 4rem 2.5rem 2rem; }\n}";
const ORIGINAL_BODY="<nav data-editor-id=\"u-1\" id=\"top\">\n<a class=\"nav-logo\" data-editor-id=\"u-2\" href=\"#top\">Unika</a>\n<ul class=\"nav-links\" data-editor-id=\"u-3\">\n<li data-editor-id=\"u-4\"><a data-editor-id=\"u-5\" href=\"#studio\">Studio</a></li>\n<li data-editor-id=\"u-6\"><a data-editor-id=\"u-7\" href=\"#filosofia\">Filosofia</a></li>\n<li data-editor-id=\"u-8\"><a data-editor-id=\"u-9\" href=\"#olistico\">Benessere</a></li>\n<li data-editor-id=\"u-10\"><a data-editor-id=\"u-11\" href=\"#trattamenti\">Trattamenti</a></li>\n<li data-editor-id=\"u-12\"><a data-editor-id=\"u-13\" href=\"#ecommerce\">Prodotti</a></li>\n<li data-editor-id=\"u-14\"><a data-editor-id=\"u-15\" href=\"#team\">Team</a></li>\n<li data-editor-id=\"u-16\"><a class=\"nav-cta\" data-editor-id=\"u-17\" href=\"#contatti\">Prenota</a></li>\n</ul>\n</nav>\n<!-- HERO -->\n<section class=\"hero\" data-editor-id=\"u-18\">\n<div class=\"hero-left\" data-editor-id=\"u-19\">\n<p class=\"hero-eyebrow au\" data-editor-id=\"u-20\">Studio di Estetica &amp; Benessere \u00b7 Torino</p>\n<h1 class=\"hero-title au d1\" data-editor-id=\"u-21\">La tua<br data-editor-id=\"u-22\"/><em data-editor-id=\"u-23\">bellezza</em><br data-editor-id=\"u-24\"/>naturale.</h1>\n<p class=\"hero-sub au d2\" data-editor-id=\"u-25\">Ogni servizio \u00e8 pensato per farti sentire accolta, ascoltata e valorizzata. Trattamenti mirati e manualit\u00e0 esperta per il tuo equilibrio autentico.</p>\n<div class=\"hero-actions au d3\" data-editor-id=\"u-26\">\n<a class=\"btn-primary\" data-editor-id=\"u-27\" href=\"#contatti\">Prenota ora</a>\n<a class=\"btn-ghost\" data-editor-id=\"u-28\" href=\"#olistico\">Scopri i massaggi</a>\n</div>\n</div>\n<div class=\"hero-right\" data-editor-id=\"u-29\">\n<img alt=\"Studio Unika\" class=\"hero-image\" data-editor-id=\"u-30\" src=\"https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=800&amp;q=80\"/>\n</div>\n</section>\n<!-- GALLERY STUDIO -->\n<section class=\"gallery-studio\" data-editor-id=\"u-31\" id=\"studio\">\n<p class=\"section-label\" data-editor-id=\"u-32\">Lo studio</p>\n<h2 class=\"section-title\" data-editor-id=\"u-33\">Benvenuta a <em data-editor-id=\"u-34\">Unika</em></h2>\n<div class=\"gallery-grid\" data-editor-id=\"u-35\">\n<div class=\"gallery-item\" data-editor-id=\"u-36\">\n<img alt=\"Studio 1\" data-editor-id=\"u-37\" src=\"https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?w=600&amp;q=80\"/>\n</div>\n<div class=\"gallery-item\" data-editor-id=\"u-38\">\n<img alt=\"Studio 2\" data-editor-id=\"u-39\" src=\"https://images.unsplash.com/photo-1580852823291-988f8006e937?w=600&amp;q=80\"/>\n</div>\n<div class=\"gallery-item\" data-editor-id=\"u-40\">\n<img alt=\"Studio 3\" data-editor-id=\"u-41\" src=\"https://images.unsplash.com/photo-1570172619644-923a1f4308f6?w=600&amp;q=80\"/>\n</div>\n</div>\n</section>\n<!-- TRATTAMENTI PREVIEW -->\n<section class=\"trattamenti-preview\" data-editor-id=\"u-42\" id=\"trattamenti-preview\">\n<p class=\"section-label\" data-editor-id=\"u-43\">Scopri i nostri servizi</p>\n<h2 class=\"section-title\" data-editor-id=\"u-44\">I nostri<br data-editor-id=\"u-45\"/><em data-editor-id=\"u-46\">trattamenti</em></h2>\n<div class=\"preview-grid\" data-editor-id=\"u-47\">\n<div class=\"preview-card\" data-editor-id=\"u-48\">\n<div class=\"preview-icon\" data-editor-id=\"u-49\">\ud83d\udc85</div>\n<h3 class=\"preview-title\" data-editor-id=\"u-50\">Nail Care</h3>\n<p class=\"preview-desc\" data-editor-id=\"u-51\">Manicure, pedicure e nail art con tecniche moderne per unghie sempre perfette.</p>\n<a class=\"preview-link\" data-editor-id=\"u-52\" href=\"#trattamenti\">Scopri di pi\u00f9 \u2192</a>\n</div>\n<div class=\"preview-card\" data-editor-id=\"u-53\">\n<div class=\"preview-icon\" data-editor-id=\"u-54\">\ud83c\udf3f</div>\n<h3 class=\"preview-title\" data-editor-id=\"u-55\">Massaggi Olistici</h3>\n<p class=\"preview-desc\" data-editor-id=\"u-56\">Rilassante, ayurvedico, drenante e anti-stress. Un viaggio verso il benessere.</p>\n<a class=\"preview-link\" data-editor-id=\"u-57\" href=\"#trattamenti\">Scopri di pi\u00f9 \u2192</a>\n</div>\n<div class=\"preview-card\" data-editor-id=\"u-58\">\n<div class=\"preview-icon\" data-editor-id=\"u-59\">\ud83c\udf38</div>\n<h3 class=\"preview-title\" data-editor-id=\"u-60\">Trattamenti Viso</h3>\n<p class=\"preview-desc\" data-editor-id=\"u-61\">Pulizia profonda, idratazione e anti-age. Protocolli personalizzati per ogni pelle.</p>\n<a class=\"preview-link\" data-editor-id=\"u-62\" href=\"#trattamenti\">Scopri di pi\u00f9 \u2192</a>\n</div>\n</div>\n</section>\n<!-- FILOSOFIA -->\n<section class=\"filosofia\" data-editor-id=\"u-63\" id=\"filosofia\">\n<div data-editor-id=\"u-64\">\n<p class=\"section-label\" data-editor-id=\"u-65\">La nostra filosofia</p>\n<h2 class=\"section-title\" data-editor-id=\"u-66\">Ogni visita,<br data-editor-id=\"u-67\"/>un <em data-editor-id=\"u-68\">rituale</em></h2>\n<blockquote class=\"filosofia-quote\" data-editor-id=\"u-69\">\"Da Unika ogni servizio \u00e8 pensato per farti sentire accolta, ascoltata e valorizzata.\"</blockquote>\n<p class=\"filosofia-text\" data-editor-id=\"u-70\">Unika nasce dall'unione di esperienza, passione e attenzione profonda per la cura della persona. Ogni trattamento \u00e8 studiato per offrire risultati visibili e, allo stesso tempo, regalare un momento di autentico relax. Un'esperienza pensata per te \u2014 per donne di ogni et\u00e0 che desiderano sentirsi coccolate, e per chiunque cerchi uno spazio di benessere genuino e rigenerante.</p>\n</div>\n<div data-editor-id=\"u-71\">\n<div class=\"filosofia-values\" data-editor-id=\"u-72\">\n<div class=\"value-card\" data-editor-id=\"u-73\">\n<p class=\"value-title\" data-editor-id=\"u-74\">Unicit\u00e0</p>\n<p class=\"value-desc\" data-editor-id=\"u-75\">Ogni persona \u00e8 diversa. I trattamenti sono sempre personalizzati sulle tue esigenze specifiche.</p>\n</div>\n<div class=\"value-card\" data-editor-id=\"u-76\">\n<p class=\"value-title\" data-editor-id=\"u-77\">Ascolto</p>\n<p class=\"value-desc\" data-editor-id=\"u-78\">Partiamo sempre da te: la tua storia, il tuo momento, i tuoi bisogni. L'ascolto \u00e8 la base di tutto.</p>\n</div>\n<div class=\"value-card\" data-editor-id=\"u-79\">\n<p class=\"value-title\" data-editor-id=\"u-80\">Benessere</p>\n<p class=\"value-desc\" data-editor-id=\"u-81\">Un approccio olistico che unisce estetica e benessere profondo, per sentirti in armonia dentro e fuori.</p>\n</div>\n<div class=\"value-card\" data-editor-id=\"u-82\">\n<p class=\"value-title\" data-editor-id=\"u-83\">Qualit\u00e0</p>\n<p class=\"value-desc\" data-editor-id=\"u-84\">Prodotti selezionati, tecniche aggiornate e cura meticolosa in ogni dettaglio del servizio.</p>\n</div>\n</div>\n</div>\n</section>\n<!-- OLISTICO FOCUS -->\n<section class=\"olistico\" data-editor-id=\"u-85\" id=\"olistico\">\n<div class=\"olistico-visual\" data-editor-id=\"u-86\">\n<div class=\"olistico-circle\" data-editor-id=\"u-87\"></div>\n<div class=\"olistico-circle-sm\" data-editor-id=\"u-88\"></div>\n<div class=\"olistico-card\" data-editor-id=\"u-89\">\n<p class=\"olistico-card-title\" data-editor-id=\"u-90\">Il tocco che trasforma</p>\n<p class=\"olistico-card-text\" data-editor-id=\"u-91\">I massaggi olistici di Unika non sono semplici trattamenti: sono un viaggio sensoriale verso il tuo equilibrio pi\u00f9 profondo. Con manualit\u00e0 esperta e presenza autentica, Silvia ti accompagna in un percorso di rilascio, ascolto e rigenerazione del corpo e della mente.</p>\n</div>\n</div>\n<div data-editor-id=\"u-92\">\n<p class=\"section-label\" data-editor-id=\"u-93\">Il cuore di Unika</p>\n<h2 class=\"section-title\" data-editor-id=\"u-94\">Massaggi<br data-editor-id=\"u-95\"/><em data-editor-id=\"u-96\">olistici</em></h2>\n<div class=\"massaggi-list\" data-editor-id=\"u-97\">\n<div class=\"massaggio-item\" data-editor-id=\"u-98\">\n<div class=\"massaggio-dot\" data-editor-id=\"u-99\"></div>\n<div data-editor-id=\"u-100\">\n<p class=\"massaggio-name\" data-editor-id=\"u-101\">Massaggio Rilassante</p>\n<p class=\"massaggio-desc\" data-editor-id=\"u-102\">Manovre lente e avvolgenti per sciogliere le tensioni fisiche e mentali. Ideale per ritrovare la calma e ricaricare le energie.</p>\n</div>\n</div>\n<div class=\"massaggio-item\" data-editor-id=\"u-103\">\n<div class=\"massaggio-dot\" data-editor-id=\"u-104\"></div>\n<div data-editor-id=\"u-105\">\n<p class=\"massaggio-name\" data-editor-id=\"u-106\">Massaggio Ayurvedico</p>\n<p class=\"massaggio-desc\" data-editor-id=\"u-107\">Tecnica millenaria di origine indiana con oli caldi e manovre ritmiche per riequilibrare il flusso energetico del corpo.</p>\n</div>\n</div>\n<div class=\"massaggio-item\" data-editor-id=\"u-108\">\n<div class=\"massaggio-dot\" data-editor-id=\"u-109\"></div>\n<div data-editor-id=\"u-110\">\n<p class=\"massaggio-name\" data-editor-id=\"u-111\">Massaggio Drenante</p>\n<p class=\"massaggio-desc\" data-editor-id=\"u-112\">Stimolazione del sistema linfatico per eliminare le tossine e ridurre gonfiore e ritenzione idrica. Leggero e profondamente benefico.</p>\n</div>\n</div>\n<div class=\"massaggio-item\" data-editor-id=\"u-113\">\n<div class=\"massaggio-dot\" data-editor-id=\"u-114\"></div>\n<div data-editor-id=\"u-115\">\n<p class=\"massaggio-name\" data-editor-id=\"u-116\">Massaggio Anti-stress</p>\n<p class=\"massaggio-desc\" data-editor-id=\"u-117\">Focus su collo, spalle e schiena: le zone pi\u00f9 colpite dallo stress quotidiano. Un'ora per rimettere tutto al suo posto.</p>\n</div>\n</div>\n<div class=\"massaggio-item\" data-editor-id=\"u-118\">\n<div class=\"massaggio-dot\" data-editor-id=\"u-119\"></div>\n<div data-editor-id=\"u-120\">\n<p class=\"massaggio-name\" data-editor-id=\"u-121\">Percorso Benessere Personalizzato</p>\n<p class=\"massaggio-desc\" data-editor-id=\"u-122\">Un rituale su misura che combina pi\u00f9 tecniche in un'esperienza unica e trasfor function fieldHtml(p,cs){const key=p[0],label=p[1],cssp=p[2],type=p[3];let value=valOrBlank(cs.getPropertyValue(cssp));if(type==='color')value=cssColorToHex(value);if(type==='select'){if(key==='fontFamily')return '<div class="field"><label>'+label+'</label><select data-prop="'+cssp+'"><option value="">—</option><option value="\'Cormorant Garamond\', serif">Cormorant Garamond</option><option value="\'DM Sans\', sans-serif">DM Sans</option><option value="serif">serif</option><option value="sans-serif">sans-serif</option></select></div>';return '<div class="field"><label>'+label+'</label><select data-prop="'+cssp+'"><option value="">—</option><option>left</option><option>center</option><option>right</option><option>justify</option></select></div>'}return '<div class="field"><label>'+label+'</label><input data-prop="'+cssp+'" type="'+(type==='color'?'color':'text')+'" value="'+htmlEscapeAttr(value)+'"></div>'}
function refreshInspector(){
 const c=editor.getSelected(),pane=document.getElementById('style-body'),el=c&&c.getEl();if(!el){pane.innerHTML='<div class="hint">Seleziona un elemento nel canvas.</div>';return}
 const cs=el.ownerDocument.defaultView.getComputedStyle(el);
 let out='<div class="hint" style="margin-bottom:12px"><b>'+el.tagName.toLowerCase()+'</b>'+(el.className?' · .'+String(el.className).split(/\s+/).join('.'):'')+'</div>';
 out+='<div class="style-group"><h4>Tipografia</h4>'+props.slice(0,6).map(p=>fieldHtml(p,cs)).join('')+'</div>';
 out+='<div class="style-group"><h4>Spazi e dimensioni</h4>'+props.slice(6,10).map(p=>fieldHtml(p,cs)).join('')+'</div>';
 out+='<div class="style-group"><h4>Bordi e ombre</h4>'+props.slice(10).map(p=>fieldHtml(p,cs)).join('')+'</div>';
 if(el.tagName==='IMG')out+='<div class="style-group"><h4>Immagine</h4><div class="image-actions"><button class="smallbtn" id="openAssets">Apri Asset Manager</button></div><div class="field"><label>URL</label><input id="imgUrl" type="text" value="'+htmlEscapeAttr(el.getAttribute('src')||'')+'"></div><div class="image-actions"><button class="smallbtn" id="applyImg">Applica URL</button><input id="imgFile" type="file" accept="image/*"></div></div>';
 out+='<div class="style-group"><h4>Azioni</h4><div class="image-actions"><button class="smallbtn" id="duplicateEl">Duplica</button><button class="smallbtn danger" id="deleteEl">Elimina</button></div></div>';pane.innerHTML=out;
 pane.querySelectorAll('[data-prop]').forEach(input=>{const prop=input.dataset.prop;if(input.tagName==='SELECT'){const val=cs.getPropertyValue(prop).trim();input.value=Array.from(input.options).some(o=>o.value===val)?val:''}input.addEventListener('input',()=>{if(input.value!=='')el.style.setProperty(prop,input.value);else el.style.removeProperty(prop);refreshInspector()})});
 const oa=document.getElementById('openAssets');if(oa)oa.onclick=openAssetManager;const ai=document.getElementById('applyImg');if(ai)ai.onclick=()=>{const u=document.getElementById('imgUrl').value.trim();if(u)setImage(u)};const fi=document.getElementById('imgFile');if(fi)fi.onchange=()=>fileToImage(fi.files[0]);
 const du=document.getElementById('duplicateEl');if(du)du.onclick=()=>{const cc=editor.getSelected();if(cc){const clone=cc.clone();cc.parent().append(clone);editor.select(clone)}};const de=document.getElementById('deleteEl');if(de)de.onclick=()=>{const cc=editor.getSelected();if(cc)cc.remove()}
}
function setImage(src){const c=editor.getSelected();if(!c||c.get('type')!=='image')return;c.addAttributes({src:src});const el=c.getEl();if(el)el.src=src;editor.AssetManager.add({src:src});refreshInspector()}
function fileToImage(file){if(!file)return;const r=new FileReader();r.onload=e=>setImage(e.target.result);r.readAsDataURL(file)}
function openAssetManager(){const modal=document.getElementById('asset-modal'),grid=document.getElementById('assetGrid');grid.innerHTML='';const assets=editor.AssetManager.getAll();if(!assets.length)grid.innerHTML='<div class="empty" style="grid-column:1/-1">Nessun asset salvato.</div>';assets.forEach(a=>{const src=a.get('src'),d=document.createElement('div');d.className='asset';d.innerHTML='<img src="'+htmlEscapeAttr(src)+'"><small>'+htmlEscapeAttr(a.get('name')||src)+'</small>';d.onclick=()=>{setImage(src);modal.style.display='none'};grid.appendChild(d)});modal.style.display='flex'}
document.getElementById('assetBtn').onclick=openAssetManager;document.getElementById('assetClose').onclick=()=>document.getElementById('asset-modal').style.display='none';
document.getElementById('assetUrlBtn').onclick=()=>{const u=document.getElementById('assetUrl').value.trim();if(u){setImage(u);editor.AssetManager.add({src:u});openAssetManager()}};document.getElementById('assetFile').onchange=()=>fileToImage(document.getElementById('assetFile').files[0]);
document.getElementById('homeBtn').onclick=()=>loadPage('home');document.getElementById('shopBtn').onclick=()=>loadPage('shop');

function inlineRules(h){const box=document.createElement('div');box.innerHTML=h;let rules='';box.querySelectorAll('[style]').forEach(el=>{let id=el.getAttribute('data-editor-id')||'export-'+Math.random().toString(36).slice(2,9);el.setAttribute('data-editor-id',id);rules+='[data-editor-id="'+id+'"]{'+el.getAttribute('style')+'}\n';el.removeAttribute('style')});box.querySelectorAll('[data-editor-id]').forEach(el=>el.removeAttribute('data-editor-id'));return {html:box.innerHTML,css:rules}}
function exportPage(which){const current=page;if(which!==current)loadPage(which);const pack=inlineRules(editor.getHtml());const base=ORIGINAL_CSS+(which==='shop'?SHOP_CSS:'');const cssOut=base+'\n/* STILI COMPONENT-FIRST GENERATI DALL’EDITOR */\n'+pack.css;
 const jsOut=ORIGINAL_JS+'\n\n/* Shop: richiesta ordine senza pagamento online */\ndocument.addEventListener("submit",function(e){if(e.target&&e.target.id==="shop-order-form"){e.preventDefault();const f=e.target,d=new FormData(f);const body="Nome: "+d.get("nome")+"\\nTelefono: "+d.get("telefono")+"\\nProdotto: "+d.get("prodotto")+"\\nQuantità: "+d.get("quantita")+"\\nNote: "+d.get("note");window.location.href="mailto:info@unika.it?subject=Richiesta ordine Unika&body="+encodeURIComponent(body)}});';
 const doc='<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Unika — Studio di Estetica & Benessere Torino</title><link href="'+FONT_URL+'" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>'+pack.html+'<script src="js/main.js"><\/script></body></html>';
 return {'index.html':which==='home'?doc:'','shop.html':which==='shop'?doc:'','css/style.css':cssOut,'js/main.js':jsOut}
}
function crc32(bytes){let c=0xffffffff;for(let i=0;i<bytes.length;i++){c^=bytes[i];for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
function u16(n){return[n&255,(n>>>8)&255]}function u32(n){return[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function makeZip(files){const enc=new TextEncoder(),parts=[],central=[];let offset=0;Object.entries(files).forEach(([name,text])=>{if(!text)return;const nb=enc.encode(name),db=enc.encode(text),crc=crc32(db),head=new Uint8Array([80,75,3,4,20,0,0,0,0,0,0,0,0,0,...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),0,0,...nb]);parts.push(head,db);central.push({name:nb,crc:crc,size:db.length,offset:offset});offset+=head.length+db.length});const cdStart=offset;central.forEach(x=>{const h=new Uint8Array([80,75,1,2,20,0,20,0,0,0,0,0,0,0,...u32(x.crc),...u32(x.size),...u32(x.size),...u16(x.name.length),0,0,0,0,0,0,0,0,...u32(x.offset),...x.name]);parts.push(h);offset+=h.length});const end=new Uint8Array([80,75,5,6,0,0,0,0,...u16(central.length),...u16(central.length),...u32(offset-cdStart),...u32(cdStart),0,0]);parts.push(end);return new Blob(parts,{type:'application/zip'})}
document.getElementById('exportBtn').onclick=()=>{const current=page,files=exportPage(current),other=current==='home'?'shop':'home';Object.assign(files,exportPage(other));loadPage(current);const zip=makeZip(files),a=document.createElement('a');a.href=URL.createObjectURL(zip);a.download='unika-sito-export.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
})();
</script></body></html>
